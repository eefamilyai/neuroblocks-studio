name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build site + offline single-file copy
        run: |
          npm run build:single
          npm run build
          cp dist-single/index.html dist/neuroblocks-studio-offline.html
          touch dist/.nojekyll
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gradient checks, physics, missions and learning tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install onnx onnxruntime numpy
      - name: Verify ONNX / Python exports against the browser maths
        run: npm run test:export
